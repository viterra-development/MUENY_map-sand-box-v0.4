name = "muenytx-map-sandbox"
compatibility_date = "2026-01-01"
main = "src/worker.js"

[assets]
directory = "./publish/wwwroot"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The worker must run in front of static assets so `/` can serve the landing
# page and /api/* stays dynamic.
run_worker_first = true

# Auth + saved-views storage (users, sessions, views — keys are prefixed).
[[kv_namespaces]]
binding = "AUTH_KV"
id = "76b7d02037c4416bb9c8cfcf681b02e7"

# Optional secret (set with `wrangler secret put INVITE_CODE`): when present,
# registration requires this code; when absent, registration is open.

# Google Form destination for /api/log-visit. The Worker skips the Form POST
# and only console.logs until these exist. Configure them as Worker SECRETS,
# not [vars]: this file is public, and anyone holding the Form + entry IDs can
# POST junk rows straight to the Form, bypassing the Worker's rate limiting.
#
# Setup: docs.google.com/forms → New form → 9 short-answer fields
# (IP, Timestamp, Path, User-Agent, Referrer, Country, City, Region, ASN),
# link Responses to a Sheet, then three-dot menu → "Get pre-filled link" →
# fill each field with its own name → "Get link" → the URL contains
# entry.NNN=... for each question. Then run, for each value:
#
#   wrangler secret put GOOGLE_FORM_ID
#   wrangler secret put GOOGLE_FORM_ENTRY_IP
#   wrangler secret put GOOGLE_FORM_ENTRY_TS
#   wrangler secret put GOOGLE_FORM_ENTRY_PATH
#   wrangler secret put GOOGLE_FORM_ENTRY_UA
#   wrangler secret put GOOGLE_FORM_ENTRY_REF
#   wrangler secret put GOOGLE_FORM_ENTRY_COUNTRY
#   wrangler secret put GOOGLE_FORM_ENTRY_CITY
#   wrangler secret put GOOGLE_FORM_ENTRY_REGION
#   wrangler secret put GOOGLE_FORM_ENTRY_ASN
#
# Also add a Cloudflare WAF rate-limiting rule on POST /api/log-visit — the
# Worker's in-memory limiter is best-effort only.
