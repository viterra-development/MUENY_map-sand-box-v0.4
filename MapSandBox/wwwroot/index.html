<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUENY</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="MapSandBox.styles.css" rel="stylesheet" />
    <link href="css/parcelTripUI.css" rel="stylesheet" />
    <link href="css/auth.css" rel="stylesheet" />
    <link href="css/map-key.css" rel="stylesheet" />
    <link href="css/ui-polish.css" rel="stylesheet" />
    <link href="css/mobile.css" rel="stylesheet" />
    <!-- Swappable taste themes — js/theme-switcher.js enables exactly one.
         Pick with ?theme=glass|minimal|base (persists per browser). -->
    <link id="theme-glass" href="css/theme-glass.css" rel="stylesheet" />
    <link id="theme-minimal" href="css/theme-minimal.css" rel="stylesheet" disabled />
    <script src="js/theme-switcher.js"></script>
    <!-- MapLibre GL JS — pinned + SRI so a compromised upstream release can't run here -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"
          integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
            integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
    <!-- deck.gl full bundle — keep version + hash in sync with js/map.js loadDeckGL() -->
    <script src="https://unpkg.com/deck.gl@9.3.10/dist.min.js"
            integrity="sha384-ShkZCI1SsjyiuEQSfDaj9OLN9xhntMrIMZsOcAEp1kQhFz1vqAGjN/IhnDY3EZ0I" crossorigin="anonymous"></script>
    <!-- Custom JS for parcel trip UI (ES module — a classic script tag throws on its exports) -->
    <script type="module" src="js/parcelTripUI.js"></script>
    <!-- Fiscal metrics (ES module) — registers window.MuenyFiscal for the
         sidebar color-mode toggle, map key, and coming-soon modal -->
    <script type="module" src="js/fiscal.js"></script>
    <!-- Google Fonts for MUENY header -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- MUENY Header Bar -->
    <header id="terravex-header">
      <div class="header-left">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle layers panel">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect y="3" width="20" height="2" rx="1" fill="white"/><rect y="9" width="20" height="2" rx="1" fill="white"/><rect y="15" width="20" height="2" rx="1" fill="white"/></svg>
        </button>
        <span class="header-logo">MUENY</span>
        <div class="header-subtitle">Civic Intelligence</div>
      </div>
      <div class="header-right">
        <button id="trip-panel-toggle" class="trip-panel-toggle" aria-label="Toggle trip summary">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="6" height="5" rx="1" fill="white"/><rect x="2" y="10" width="6" height="7" rx="1" fill="white"/><rect x="10" y="3" width="8" height="14" rx="1" fill="white" opacity="0.5"/></svg>
        </button>
      </div>
    </header>

    <div id="app">
      <div id="terravex-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">MUENY</div>
        <div class="loader-subtext">Loading municipal data...</div>
      </div>
    </div>

    <!-- Sidebar backdrop for mobile overlay -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Hidden — JS fallback suppresses this before it ever shows -->
    <div id="blazor-error-ui" style="display:none !important;"></div>

    <!-- Try Blazor WASM first -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <!-- Passive visit log (external file so the CSP can forbid inline scripts) -->
    <script src="js/visit-beacon.js"></script>

    <!-- Account/session client — shared by the Blazor and JS-fallback paths -->
    <script src="js/auth.js"></script>

    <!-- Map key + help guide (shared by both paths) -->
    <script src="js/map-key.js"></script>
    <script src="js/help.js"></script>
    <script src="js/layer-tips.js"></script>
    <script src="js/mobile-ui.js"></script>

    <!-- Fallback: if Blazor fails to load, initialize map directly via JS -->
    <script type="module" src="js/app-fallback.js"></script>
  </body>
</html>
